<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- ! Importando Estilos -->
    <link rel="stylesheet" href="../CSS/contact.css" />
    <link rel="stylesheet" href="../CSS/nav.css">
</head>

<body>
    <header>
        <div id="nav-container"></div>
        
        <section class="banner">
            <div class="bannerContenedor">
                <h1>titulo</h1>
                <p>descripcion</p>
            </div>
        </section>
        
    </header>

    <section class="">
        <div class="container text-center">
            <div class="row">
                <div class="col-7">
                    <div class="form container mt-5">
                        <section id="contacto">
                            <h2>Contáctanos</h2>
                            <form id="contact-form" action="https://formspree.io/f/mojyekll" method="POST" novalidate>
                                
                                <div class="formulario mb-3">
                                    <!-- nombre -->
                                    <label class="form-label">Nombre</label>
                                    <input id="nombre" type="text" class="form-control" placeholder="Ingrese su nombre y apellido" required>
                                    <small id="error-nombre" class="error"></small>
                                    <!-- correo -->
                                    <label for="email">Correo</label>
                                    <input id="email" class="form-control" name="email" type="email"/>
                                    <small id="error-email" class="error"></small>
                                    <!-- telefono -->

                                    <label for="telefono">Telefono</label>
                                    <input id="telefono" class="form-control" name="telefono" type="tel" />
                                    <small id="error-telefono" class="error"></small>
                                    <!-- mensaje -->
                                    <label for="mensaje">Mensaje</label>
                                    <textarea id="mensaje" class="form-control" name="mensaje" rows="5"></textarea>
                                    <small id="error-mensaje" class="error"></small>

                                </div>
                                <!-- Anti-spam -->
                                <input type="text" name="_gotcha" style="display:none" />

                                <button type="submit">Enviar</button>
                                <p id="estado"></p>
                            </form>
                        </section>
                    </div>
                </div>
                <div class="col-4 mt-5 offset-1 d-flex align-items-center ">
                    <section id="info">
                        <!-- <h2>Contáctanos</h2> -->
                        <div class="card shadow-sm mx-auto" style="width: 18rem;">
                            <div class="card-header fw-semibold">
                                Informacion de contacto
                            </div>
                            <ul class="list-group list-group-flush">
                                <li class="list-group-item">
                                    Teléfono de contacto<br>3004005000
                                </li>
                                <li class="list-group-item">
                                    Correo electrónico<br>aureaesmeraldagen10@gmail.com
                                </li>
                                <li class="list-group-item">
                                    Dirección <br>Avenida Siempre Viva
                                </li>
                            </ul>
                        </div>
                    </section>
                </div>
            </div>
        </div>
    </section>
    
    <div id="footer-container"></div>





    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"></script>
    <script src="../Script/formScript.js"></script>    
    <script src="../Script/footerScript.js"></script>
</body>

</html>
