<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../CSS/nav.css">
    <link rel="stylesheet" href="../CSS/adminAddProduct.css">
    <link rel="stylesheet" href="../CSS/adminHome.css">
</head>

<body>
    <!--!INICIO SIDEBAR-->

    <div id="sidebar-container">
    </div>
    <!--!FIN SIDEBAR-->

    <button class="btn d-md-none m-3 admin-toggle-btn" type="button" data-bs-toggle="offcanvas"
        data-bs-target="#sidebar" aria-controls="sidebar" aria-label="Abrir menú administrador">
        ☰
    </button>

    <main>
        <div class="container">

            <!-- TÍTULO -->
            <div class="mb-4">
                <h2 class="fw-bold">Panel Administrador</h2>
                <p class="text-muted">Resumen general del sistema</p>
            </div>

            <!-- KPIs -->
            <div class="row g-4 mb-4">

                <div class="col-md-3 col-6">
                    <div class="card text-center">
                        <div class="card-body">
                            <h6 class="text-muted">Productos</h6>
                            <h3 class="fw-bold" id="totalProductos">0</h3>
                        </div>
                    </div>
                </div>

                <div class="col-md-3 col-6">
                    <div class="card text-center">
                        <div class="card-body">
                            <h6 class="text-muted">Pedidos</h6>
                            <h3 class="fw-bold" id="totalPedidos">0</h3>
                        </div>
                    </div>
                </div>

                <div class="col-md-3 col-6">
                    <div class="card text-center">
                        <div class="card-body">
                            <h6 class="text-muted">Stock bajo</h6>
                            <h3 class="fw-bold" id="stockBajo">0</h3>
                        </div>
                    </div>
                </div>

                <div class="col-md-3 col-6">
                    <div class="card text-center">
                        <div class="card-body">
                            <h6 class="text-muted">Agotados</h6>
                            <h3 class="fw-bold" id="agotados">0</h3>
                        </div>
                    </div>
                </div>

            </div>

            <!-- ÚLTIMOS PEDIDOS -->
            <div class="card">
                <div class="card-body">
                    <h5 class="fw-bold mb-3">Últimos pedidos</h5>

                    <ul class="list-group" id="listaPedidos">
                        <li class="list-group-item text-muted">
                            No hay pedidos aún
                        </li>
                    </ul>
                </div>
            </div>

        </div>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script type="module" src="../Script/adminDashboard.js"></script>
    <script type="module" src="../Script/sideBar.js"></script>

</body>


</html>
