<!doctype html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mis favoritos - Aurea Esmeralda</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" />
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;500;700&display=swap" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
        crossorigin="anonymous" />

    <link rel="stylesheet" href="../CSS/nav.css" />
    <link rel="stylesheet" href="../CSS/navLogin.css" />
    <link rel="stylesheet" href="../CSS/favoritos.css" />
</head>

<body>

    <header>
        <div id="nav-container"></div>
    </header>

    <main class="container pb-5">

        <!-- Encabezado de sección -->
        <div class="encabezado-favoritos">
            <span class="etiqueta-favoritos">Colección personal</span>
            <h2 class="titulo-favoritos">Mis <em>Favoritos</em></h2>
            <span class="contador-favoritos" id="contador-favoritos"></span>
        </div>

        <div class="row g-4" id="cuadricula-productos">
            <div class="container">
                <div class="row row-cols-1 row-cols-md-3 row-cols-lg-4 g-4" id="contenedor-tarjetas">
                </div>
            </div>
        </div>

    </main>


    <!-- Toast -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3">
        <div id="notificacion-carrito" class="toast align-items-center text-bg-dark border-0" role="alert">
            <div class="d-flex">
                <div class="toast-body">
                    <i class="bi bi-bag-check-fill me-2" style="color: #d4af37"></i>
                    Producto agregado al carrito
                </div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
            </div>
        </div>
    </div>

    <!-- ! Importamos FOOTER -->
    <div class="cont-foot">
        <div id="footer-container"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous">
        </script>
    <script src="../Script/navLogeadoActivo.js"></script>
    <script src="../Script/footerScript.js"></script>
    <script type="module" src="../Script/favoritos.js"></script>

</body>

</html>
