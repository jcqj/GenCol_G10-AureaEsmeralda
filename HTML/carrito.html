<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrito de Compras - Aurea esmerala</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../CSS/carrito.css">

</head>

<body>

    <div class="cart-wrapper py-5 bg-light">
        <div class="container">
            <div class="row g-4">
                <div class="col-lg-8">
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <h2 class="h4 mb-0 fw-bold">Tu Carrito</h2>
                        <span id="cart-count" class="badge bg-dark rounded-pill">3 Productos</span>
                        <!--id para cambiar cuando se agregan los productos-->
                    </div>


                    <!-- ! INICIO CARDS DINAMICAS -->
                    <div class="container py-4 border rounded-4 shadow-sm bg-white">
                        <p class="cart-subtitle mb-4">Productos agregados a tu carrito</p>
                        <!-- #Aquí aparecen las cards -->
                        <div >
                            <!-- ! Las cards se generan con JS -->

                            <div id="contenedorCardss" class="d-flex flex-column gap-3"></div>


                        </div>
                        <div class="text-start mt-5">
                            <a href="./productos.html" class="btn btn-continue">
                                <i class="bi bi-arrow-left me-2"></i>Continue Shopping
                            </a>
                        </div>
                    </div>
                </div>
                <!-- ! FIN CARDS DINAMICAS -->


                <div class="col-lg-4">
                    <div class="summary-card p-4 shadow-sm card sticky-top">
                        <h5 class="fw-bold mb-4">Resumen de Compra</h5>

                        <div class="d-flex justify-content-between mb-2">
                            <span class="text-muted">Subtotal</span>
                            <span id="subtotal" class="fw-semibold">$429.980,00</span>
                        </div>
                        <div class="d-flex justify-content-between mb-2">
                            <span class="text-muted">Descuento</span>
                            <span id="descuento" class="text-success fw-semibold">$26.000,00</span>
                        </div>
                        <div class="d-flex justify-content-between mb-3">
                            <span class="text-muted">Envío</span>
                            <span id="envio" class="fw-semibold">$5.00</span>
                        </div>
                        <hr class="my-4">
                        <div class="d-flex justify-content-between mb-4">
                            <span class="h5 fw-bold">Total</span>
                            <span id="total" class="h5 fw-bold text-primary">$408.988,00</span>
                        </div>

                        <div class="input-group mb-4">
                            <input type="text" class="form-control" placeholder="Cupón" aria-label="Cupón">
                            <button class="btn btn-dark" type="button">Aplicar</button>
                        </div>

                        <button class="btn btn-primary checkout-btn w-100 mb-3 py-3">
                            Continuar al Pago
                        </button>

                        <div class="text-center">
                            <small class="text-muted">
                                <i class="bi bi-shield-lock-fill me-1 text-success"></i>
                                Pago seguro y encriptado
                            </small>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../Script/carrito.js"></script>

</body>

</html>
