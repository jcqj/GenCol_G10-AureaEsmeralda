<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inicio Sesión — Aurea Esmeralda</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Raleway:wght@300;400;500;600&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="../CSS/registro.css">
</head>

<body>

    <!-- Toast container -->
    <div class="toast-container-custom" id="toastContainer"></div>
    

    <div class="page-wrapper">
        <div class="btn-back">
            <a href="./productos.html"><button type="button" class="btn btn-outline-secondary" ><i class="bi bi-arrow-left"></i> Volver a Comercio
            </button></a>
        </div>

        <!-- Brand -->
        <div class="brand">
            <div class="brand-emblem">
                <img src="../assets/logo-dorado-registro.svg" alt="Aurea Esmeralda Logo" class="logo" />
            </div>
            <div class="brand-name">Aurea Esmeralda</div>
            <div class="brand-tagline">Joyería de Alta calidad</div>
            <div class="divider"><span>✦</span></div>
        </div>

        <!-- Card -->
        <div class="register-card">
            
            <div class="card-title">Iniciar Sesión</div>
            <div class="card-subtitle">Inicia sesión y aprovecha los beneficios que tenemos para ti</div>

            <form id="loginForm" novalidate autocomplete="off">

                <!-- Email -->
                <div class="form-group" id="group-email">
                    <label for="email">Correo electrónico <span
                            style="color:var(--gold-dim);font-size:.6rem;">(usuario)</span></label>
                    <div class="input-wrapper">
                        <input type="email" id="email" name="email" class="form-control"
                            placeholder="correo@ejemplo.com" maxlength="100" />
                        <i class="bi bi-envelope icon"></i>
                    </div>
                    <div class="error-msg" id="err-email">
                        <i class="bi bi-exclamation-circle-fill"></i>
                        <span id="err-email-text"></span>
                    </div>
                </div>

                <!-- Contraseña -->
                <div class="form-group" id="group-password">
                    <label for="password">Contraseña</label>
                    <div class="input-wrapper">
                        <input type="password" id="password" name="password" class="form-control"
                            placeholder="Mín. 8 caracteres" maxlength="64" />
                        <i class="bi bi-lock icon"></i>
                        <button type="button" class="toggle-pass" id="togglePass" title="Mostrar/ocultar contraseña"
                            aria-label="Toggle password">
                            <i class="bi bi-eye-slash" id="eyeIcon"></i>
                        </button>
                    </div>
                    <!-- Strength -->
                    <div class="strength-wrap" id="strengthWrap" style="display:none;">
                        <div class="strength-bar">
                            <div class="strength-fill" id="strengthFill"></div>
                        </div>
                        <div class="strength-label" id="strengthLabel"></div>
                    </div>
                    <div class="error-msg" id="err-password">
                        <i class="bi bi-exclamation-circle-fill"></i>
                        <span id="err-password-text"></span>
                    </div>
                </div>

                <!-- Submit -->
                <button type="submit" class="btn-register" id="submitBtn">
                    Iniciar Sesión
                </button>

            </form>

            <!-- Footer link -->
            <div class="form-footer">
                ¿No tienes cuenta? <a href="./registro.html">Registrate</a>
            </div>
        </div>
        <!-- 
        <div class="btn-back">
            <button type="button" class="btn btn-outline-secondary" onclick="window.history.back()"><i class="bi bi-arrow-left"></i> Volver a Comercio
            </button>
        </div> -->

    </div><!-- end page-wrapper -->

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../Script/login.js"></script>
</body>

</html>
